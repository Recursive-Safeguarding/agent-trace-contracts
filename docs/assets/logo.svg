<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="agent-trace-contracts">
  <title>agent-trace-contracts</title>
  <desc>A trace carrying two duties: the left one discharged and closed, the right one still owed at an open deadline.</desc>
  <!-- Light colours are presentation attributes, so a renderer with no CSS support still gets them
       right. The dark block overrides only where the cascade is honoured. RS teal measures 8.75:1
       on white but 2.16:1 on GitHub's dark canvas, so the mark lightens to 8.71:1 there and the
       trace darkens to stay subordinate. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .mark  { stroke: #5CBFC0; }
      .node  { fill:   #5CBFC0; }
      .trace { stroke: #2C5757; }
    }
  </style>

  <line class="trace" x1="8" y1="68" x2="68" y2="68" stroke="#D0E1E1" stroke-width="3.5" stroke-linecap="round"/>

  <path class="mark" d="M15 68 Q27 -34 39 68" fill="none" stroke="#165354" stroke-width="5.5" stroke-linecap="round"/>
  <circle class="node" cx="15" cy="68" r="6" fill="#165354"/>
  <circle class="node" cx="39" cy="68" r="6" fill="#165354"/>

  <path class="mark" d="M57 68 Q69 -34 81 68" fill="none" stroke="#165354" stroke-width="5.5"
        stroke-linecap="round" stroke-dasharray="12 10"/>
  <circle class="node" cx="57" cy="68" r="6" fill="#165354"/>
  <circle class="mark" cx="81" cy="68" r="10.5" fill="none" stroke="#165354" stroke-width="4.2"/>
</svg>
