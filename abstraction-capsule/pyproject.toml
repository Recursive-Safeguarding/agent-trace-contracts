[project]
name = "rs-capsule-acceptance"
version = "0.1.0"
description = "Acceptance tests for the non-normative end-to-end abstraction capsule (the demonstration package)"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["rs_metalang_ref==0.1.0"]

[dependency-groups]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rs_capsule"]

[tool.uv.sources]
rs_metalang_ref = { path = "../interpreter", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
